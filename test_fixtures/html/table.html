<!doctype html>
<html>
  <head>
    <title>Table Elements Fixture</title>
  </head>
  <body>
    <h1>Sample Table</h1>
    <table id="sample-table">
      <caption>
        Example Data Table
      </caption>
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Role</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>1</td>
          <td>Alice</td>
          <td>Engineer</td>
          <td>Active</td>
        </tr>
        <tr>
          <td>2</td>
          <td>Bob</td>
          <td>Designer</td>
          <td>Inactive</td>
        </tr>
        <tr>
          <td>3</td>
          <td>Charlie</td>
          <td>Manager</td>
          <td>Active</td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <td colspan="4">End of Table</td>
        </tr>
      </tfoot>
    </table>
  </body>
</html>
